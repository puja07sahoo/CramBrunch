<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - CRAMBRUNCH</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a);
color:#fff;
}

/* back button */
.back-btn{
position:absolute;
top:20px;
left:20px;
padding:8px 16px;
background:#2563eb;
border:none;
border-radius:6px;
color:#fff;
cursor:pointer;
transition:.3s;
}

.back-btn:hover{
transform:scale(1.05);
box-shadow:0 0 10px #2563eb;
}

/* card */
.box{
width:360px;
padding:30px;
background:rgba(30,41,59,.6);
backdrop-filter:blur(10px);
border-radius:14px;
box-shadow:0 0 25px rgba(37,99,235,.3);
animation:fade .8s ease;
}

.box h2{
text-align:center;
margin-bottom:18px;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:6px;
outline:none;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#22c55e;
color:#fff;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
background:#16a34a;
transform:scale(1.03);
box-shadow:0 0 12px #22c55e;
}

#msg{
margin-top:12px;
text-align:center;
color:#22c55e;
}

.extra{
text-align:center;
margin-top:12px;
font-size:14px;
}

.extra a{
color:#60a5fa;
text-decoration:none;
}

.extra a:hover{
text-decoration:underline;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<button class="back-btn" onclick="window.location='login.html'">← Login</button>

<div class="box">

<h2>✨ Signup</h2>

<select id="role">
<option value="">Select Role</option>
<option value="student">Student</option>
<option value="teacher">Teacher</option>
<option value="admin">Admin</option>
</select>

<input id="id" placeholder="User ID">
<input id="roll" placeholder="Roll Number">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone Number">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Create Account</button>

<p id="msg"></p>

<div class="extra">
Already have account? <a href="login.html">Login</a>
</div>

<div class="extra">
Forgot password? <a href="forgot.html">Reset Here</a>
</div>

</div>

<script>
function signup(){

let role     = document.getElementById("role").value;
let userId   = document.getElementById("id").value;
let rollNo   = document.getElementById("roll").value;
let email    = document.getElementById("email").value;
let phone    = document.getElementById("phone").value;
let password = document.getElementById("pass").value;

if(role==="" || userId==="" || rollNo==="" || email==="" || phone==="" || password===""){
document.getElementById("msg").innerText="Fill all fields";
return;
}

fetch("/signup",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
role:role,
userId:userId,
rollNo:rollNo,
email:email,
phone:phone,
password:password
})
})
.then(res=>res.json())
.then(data=>{

document.getElementById("msg").innerText=data.msg;

if(data.msg==="Signup Success"){
setTimeout(()=>{
window.location="login.html";
},1200);
}

})
.catch(()=>{
document.getElementById("msg").innerText="Server Error";
});

}
</script>

</body>
</html>
